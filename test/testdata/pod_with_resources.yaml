kind: Pod
apiVersion: v1
metadata:
  name: gpu-worker
  namespace: ml
  labels:
    app: gpu-worker
    role: ml
spec:
  containers:
  - name: worker
    image: cuda-app:latest
    resources:
      limits:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/gpu: "1"
      requests:
        cpu: "2"
        memory: "8Gi"
        nvidia.com/gpu: "1"
  restartPolicy: Never
