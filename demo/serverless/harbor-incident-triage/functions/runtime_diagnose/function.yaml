kind: Function
apiVersion: v1
metadata:
  name: runtime-diagnose
  labels:
    app: harbor-incident-triage
spec:
  runtime: python
  handler: handler
  port: 8080
  minReplicas: 1
  maxReplicas: 5
  targetConcurrency: 1
  idleTimeoutSeconds: 30
  code: |
    import json
    import sys
    
    
    def compact(data):
        return json.dumps(data, separators=(",", ":"), sort_keys=True)
    
    
    def append_trace(event, step):
        trace = list(event.get("trace", []))
        trace.append(step)
        event["trace"] = trace
        event["executedSteps"] = trace
        return event
    
    
    def main(event):
        text = str(event.get("normalizedText", ""))
        diagnosis = ["Inspect container logs, restart count, exit code, and recent Pod events."]
        if "oomkilled" in text:
            diagnosis.append("OOMKilled indicates the memory limit or memory peak should be checked.")
        if "crashloop" in text:
            diagnosis.append("CrashLoopBackOff usually points to entrypoint, env, dependency, or startup probe issues.")
        if "permission denied" in text:
            diagnosis.append("Check volume permissions, image user, and security context settings.")
        if "exit code" in text:
            diagnosis.append("Map the exit code to the process failure path and inspect the previous container log.")
        out = dict(event)
        out.update(
            {
                "ok": True,
                "workflow": "harbor-incident-triage",
                "step": "runtime_diagnose",
                "diagnosisType": "runtime",
                "diagnosis": diagnosis,
                "notified": bool(out.get("notified", False)),
            }
        )
        return append_trace(out, "runtime_diagnose")
    
    
    def handler(event):
        payload = json.loads(event or "{}")
        return compact(main(payload))
    
    
    if __name__ == "__main__":
        print(json.dumps(main(json.load(sys.stdin)), indent=2, sort_keys=True))
