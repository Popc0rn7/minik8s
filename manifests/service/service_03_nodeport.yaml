kind: Service
apiVersion: v1
metadata:
  name: svc-03-nodeport
  namespace: default
  labels:
    app: svc-03-nginx
    case: minik8s-acceptance-03
spec:
  type: NodePort
  selector:
    matchLabels:
      app: svc-03-nginx
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080
