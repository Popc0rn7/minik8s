kind: Pod
apiVersion: v1
metadata:
  name: most-dog-collage
  namespace: demo
  labels:
    app: most-dog
spec:
  nodeSelector:
    node: node-a
  containers:
  - name: collage
    image: minik8s/sam-cpu
    imageTag: demo
    command: ["python"]
    args:
    - /workspace/make_collage.py
    - --workspace
    - /workspace
    - --dataset
    - /workspace/dataset.json
    - --results
    - /workspace/results
    - --output
    - /workspace/most-dog-ranking.png
    - --report
    - /workspace/most-dog-ranking.json
    volumeMounts:
    - name: work
      mountPath: /workspace
  volumes:
  - name: work
    hostPath:
      path: /tmp/most-dog
      type: DirectoryOrCreate
  restartPolicy: Never
