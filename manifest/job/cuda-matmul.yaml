apiVersion: batch/v1
kind: Job
metadata:
  name: cuda-matmul-tiled
  namespace: default
  labels:
    app: cuda-matmul-tiled
spec:
  selector:
    matchLabels:
      accelerator: gpu
  source:
    files:
      - matmul_tiled.cu
      - Makefile.matmul
    command: make -f Makefile.matmul run
  slurm:
    partition: debuga100
    qos: debug
    nodes: 1
    ntasksPerNode: 1
    cpusPerTask: 4
    gres: gpu:1
    time: "00:20:00"
  remote:
    host: sylogin.hpc.sjtu.edu.cn
    username: stu1718
    workdir: /dssg/home/acct-stu/stu1718/minik8s-gpujobs
  backoffLimit: 0
