kind: Pod
apiVersion: v1
metadata:
  name: nginx-pod
  namespace: default
  labels:
    app: nginx
    tier: frontend
spec:
  containers:
  - name: nginx
    image: nginx
    imageTag: alpine
    command: ["nginx"]
    args: ["-g", "daemon off;"]
    ports:
    - containerPort: 80
      hostPort: 8080
    resources:
      requests:
        cpu: "0.1"
        memory: "64Mi"
      limits:
        cpu: "0.5"
        memory: "128Mi"
  restartPolicy: Always
