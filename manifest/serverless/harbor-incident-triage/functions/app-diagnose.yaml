kind: Function
apiVersion: v1
metadata:
  name: app-diagnose
  labels:
    app: harbor-incident-triage
spec:
  runtime: python
  handler: handler
  port: 8080
  minReplicas: 0
  maxReplicas: 5
  targetConcurrency: 1
  idleTimeoutSeconds: 30
  code: |
    import json
    import sys
    
    
    def compact(data):
        return json.dumps(data, separators=(",", ":"), sort_keys=True)
    
    
    def append_trace(event, step):
        trace = list(event.get("trace", []))
        trace.append(step)
        event["trace"] = trace
        event["executedSteps"] = trace
        return event
    
    
    def main(event):
        text = str(event.get("normalizedText", ""))
        diagnosis = ["Inspect the application route, upstream service, and request logs around the incident time."]
        if "502" in text or "bad gateway" in text:
            diagnosis.append("502 usually means the reverse proxy cannot reach a healthy upstream on the expected port.")
        if "404" in text or "not found" in text:
            diagnosis.append("Check path routing, DNS path rules, and application route registration.")
        if "timeout" in text:
            diagnosis.append("Check backend latency, connection pool saturation, or blocked request handlers.")
        if "websocket" in text:
            diagnosis.append("Check Upgrade and Connection headers through the proxy path.")
        out = dict(event)
        out.update(
            {
                "ok": True,
                "workflow": "harbor-incident-triage",
                "step": "app_diagnose",
                "diagnosisType": "app",
                "diagnosis": diagnosis,
                "notified": bool(out.get("notified", False)),
            }
        )
        return append_trace(out, "app_diagnose")
    
    
    def handler(event):
        payload = json.loads(event or "{}")
        return compact(main(payload))
    
    
    if __name__ == "__main__":
        print(json.dumps(main(json.load(sys.stdin)), indent=2, sort_keys=True))
