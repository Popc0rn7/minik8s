kind: Function
apiVersion: v1
metadata:
  name: summarize
  labels:
    app: serverless-demo
spec:
  runtime: python
  handler: handler
  port: 8080
  minReplicas: 1
  maxReplicas: 3
  targetConcurrency: 5
  idleTimeoutSeconds: 30
  code: |
    def handler(event):
      text = event.split(":", 1)[-1]
      words = text.split()
      return "summary-result:" + " ".join(words[:8])
