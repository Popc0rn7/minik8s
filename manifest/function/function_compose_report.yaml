kind: Function
apiVersion: v1
metadata:
  name: compose-report
  labels:
    app: serverless-demo
spec:
  runtime: python
  handler: handler
  port: 8080
  minReplicas: 1
  maxReplicas: 3
  targetConcurrency: 5
  idleTimeoutSeconds: 30
  code: |
    def handler(event):
      return "report:" + event
