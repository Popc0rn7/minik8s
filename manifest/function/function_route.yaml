kind: Function
apiVersion: v1
metadata:
  name: route
  labels:
    app: serverless-demo
spec:
  runtime: python
  handler: handler
  port: 8080
  minReplicas: 0
  maxReplicas: 3
  targetConcurrency: 5
  idleTimeoutSeconds: 30
  code: |
    def handler(event):
      text = event.lower()
      if "summary" in text or "summarize" in text:
        return "summary:" + event
      return "qa:" + event
