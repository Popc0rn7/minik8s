kind: Function
apiVersion: v1
metadata:
  name: sam-segment
  labels:
    app: sam-demo
spec:
  runtime: container
  image: minik8s/sam-cpu
  imageTag: demo
  port: 8080
  minReplicas: 0
  maxReplicas: 2
  targetConcurrency: 1
  idleTimeoutSeconds: 120
  env:
  - name: ARTIFACT_STORE_URL
    value: http://10.96.0.1:8080
  - name: MINIK8S_FUNCTION_PORT
    value: "8080"
