kind: Function
apiVersion: v1
metadata:
  name: answer
  labels:
    app: serverless-demo
spec:
  runtime: python
  handler: handler
  port: 8080
  minReplicas: 0
  maxReplicas: 3
  targetConcurrency: 5
  idleTimeoutSeconds: 30
  code: |
    def handler(event):
      text = event.split(":", 1)[-1]
      return "answer-result:received " + str(len(text)) + " chars"
